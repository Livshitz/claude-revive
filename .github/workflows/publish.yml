name: publish

# Publishes to public npm when you cut a GitHub Release (tag should match package.json version).
# The npm token is NOT stored per-repo — it's fetched at publish time from a scoped,
# read-only secrets broker. The endpoint URL and its credential live in GitHub secrets
# (NPM_TOKEN_URL, NPM_BROKER_SECRET), never in this file, so it's safe in a public repo.
on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write   # npm provenance (public repo)

jobs:
  npm:
    runs-on: macos-latest   # package is `os:darwin`, so `npm ci` must run on macOS (EBADPLATFORM on linux)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Fetch npm token from secrets broker
        env:
          TOKEN_URL: ${{ secrets.NPM_TOKEN_URL }}
          APP_SECRET: ${{ secrets.NPM_BROKER_SECRET }}
        run: |
          token=$(curl -sS -f -H "x-app-secret: $APP_SECRET" "$TOKEN_URL" | jq -r '.value')
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::Failed to fetch npm token from secrets broker"; exit 1
          fi
          echo "::add-mask::$token"
          echo "NODE_AUTH_TOKEN=$token" >> "$GITHUB_ENV"
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NODE_AUTH_TOKEN }}
